version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j-asi-memory
    ports:
      - "7474:7474"  # HTTP browser interface
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/asi-memory-2026
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./memory/neo4j/data:/data
      - ./memory/neo4j/logs:/logs
      - ./memory/neo4j/import:/var/lib/neo4j/import
      - ./memory/neo4j/plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Qdrant vector database for embeddings
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-asi-vectors
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - ./memory/qdrant/storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    profiles:
      - vectors  # Only start when explicitly requested: docker-compose --profile vectors up

networks:
  default:
    name: asi-research-network
